name: marvel_heroes
description: Laboratorio PMDM UD3 de Flutter
publish_to: none
version: 3.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  http: ^1.6.0
  sensors_plus: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/heroes/capitan_america.webp
    - assets/heroes/gamora.webp
    - assets/heroes/hulk.webp
    - assets/heroes/iron_man.webp
    - assets/heroes/thor.webp
    - assets/heroes/viuda_negra.webp
